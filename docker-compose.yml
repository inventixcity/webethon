name: invigil

# Local development stack. Every host port is bound to 127.0.0.1 so nothing is exposed to the LAN.
#
#   docker compose up -d postgres mailpit   database and mail inbox (http://localhost:8025)
#   docker compose up -d --build api        Rust API on http://localhost:8080
#   docker compose --profile full up -d     also the Next.js dev server on http://localhost:3000
#
# Development defaults are not secrets. Production uses Azure Container Apps with managed secrets.

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invigil
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invigil"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  api:
    build:
      context: ./backend
    image: invigil-api:dev
    environment:
      APP_ENV: development
      BIND_ADDR: 0.0.0.0:8080
      METRICS_ADDR: 0.0.0.0:9090
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/invigil
      SMTP_URL: smtp://mailpit:1025
      APP_ORIGIN: http://localhost:3000
      RUN_MIGRATIONS: "true"
      RUST_LOG: info
      # Local file storage must live on the writable /tmp mount: the root filesystem is read-only.
      STORAGE_DIR: /tmp/storage
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Hardening, matching the Kubernetes pod spec: no writable root filesystem, no capabilities,
    # no privilege escalation. /tmp is a memory-backed scratch space.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # Optional: the Next.js dev server, so the whole stack runs in one command.
  # The frontend reaches the API over the compose network through API_ORIGIN, as the Vercel proxy does.
  web:
    profiles: ["full"]
    image: node:25-bookworm-slim
    working_dir: /app
    command:
      - sh
      - -c
      - corepack enable && pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0 --port 3000
    environment:
      API_ORIGIN: http://api:8080
      NEXT_TELEMETRY_DISABLED: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    volumes:
      - type: bind
        source: ./web
        target: /app
      # Keeps Linux node_modules out of the Windows/macOS folder, since native binaries differ by OS.
      - web-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  web-node-modules:
