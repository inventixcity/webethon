components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Default development session cookie; SESSION_COOKIE can override its name.
    hostSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: Default production session cookie; SESSION_COOKIE can override its name.
    bearerAuth:
      type: http
      scheme: bearer
      description: The same opaque session token returned at sign-in.
  schemas:
    SocialConfig:
      type: object
      properties:
        comments:
          type: boolean
        reactions:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 32
            pattern: ^[a-z0-9_-]+$
        bookmarks:
          type: boolean
      required: []
      additionalProperties: false
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entity:
          type: string
        recordId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        parentId:
          type:
          - string
          - 'null'
          format: uuid
        body:
          type:
          - string
          - 'null'
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - entity
      - recordId
      - authorId
      - parentId
      - body
      - createdAt
      - updatedAt
      - deletedAt
      additionalProperties: false
    SocialActor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
      required:
      - id
      - displayName
      additionalProperties: false
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        actor:
          $ref: '#/components/schemas/SocialActor'
        entity:
          type:
          - string
          - 'null'
        recordId:
          type:
          - string
          - 'null'
          format: uuid
        commentId:
          type:
          - string
          - 'null'
          format: uuid
        createdAt:
          type: string
          format: date-time
        readAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - kind
      - actor
      - entity
      - recordId
      - commentId
      - createdAt
      - readAt
      additionalProperties: false
    Activity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        actor:
          $ref: '#/components/schemas/SocialActor'
        entity:
          type:
          - string
          - 'null'
        recordId:
          type:
          - string
          - 'null'
          format: uuid
        commentId:
          type:
          - string
          - 'null'
          format: uuid
        createdAt:
          type: string
          format: date-time
        targetUserId:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - id
      - kind
      - actor
      - entity
      - recordId
      - commentId
      - createdAt
      - targetUserId
      additionalProperties: false
    PendingAction:
      type: object
      properties:
        actionId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - create
          - update
        entity:
          type: string
        recordId:
          type: string
          format: uuid
        data:
          type: object
          additionalProperties: true
          description: Proposed entity data, validated on confirmation.
        version:
          type: integer
        expiresAt:
          type: string
          format: date-time
      required:
      - actionId
      - kind
      - entity
      - data
      - expiresAt
      additionalProperties: false
    AssistSource:
      type: object
      properties:
        entity:
          type: string
        id:
          type: string
          format: uuid
        label:
          type: string
      required:
      - entity
      - id
      - label
      additionalProperties: false
    AssistDeltaEvent:
      type: object
      properties:
        text:
          type: string
      required:
      - text
      additionalProperties: false
    AssistSourcesEvent:
      type: object
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AssistSource'
      required:
      - sources
      additionalProperties: false
    AssistPendingEvent:
      type: object
      properties:
        pendingActions:
          type: array
          items:
            $ref: '#/components/schemas/PendingAction'
      required:
      - pendingActions
      additionalProperties: false
    AssistDoneEvent:
      type: object
      properties:
        usage:
          $ref: '#/components/schemas/Usage'
      required:
      - usage
      additionalProperties: false
    AssistErrorEvent:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
      additionalProperties: false
    NotificationEvent:
      type: object
      properties:
        notification:
          $ref: '#/components/schemas/Notification'
      required:
      - notification
      additionalProperties: false
    ResyncEvent:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    StatsRow:
      type: object
      properties:
        key:
          type:
          - string
          - number
          - boolean
          - 'null'
        value:
          type:
          - number
          - 'null'
      required:
      - key
      - value
      additionalProperties: false
    StatsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StatsRow'
        meta:
          type: object
          properties:
            metric:
              type: string
            groupBy:
              type:
              - string
              - 'null'
          required:
          - metric
          - groupBy
          additionalProperties: false
      required:
      - data
      - meta
      additionalProperties: false
    NotificationRead:
      oneOf:
      - type: object
        properties:
          ids:
            type: array
            items:
              type: string
              format: uuid
            maxItems: 100
        required:
        - ids
        additionalProperties: false
      - type: object
        properties:
          all:
            type: boolean
            const: true
        required:
        - all
        additionalProperties: false
    SocialPageMeta:
      type: object
      properties:
        nextCursor:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - nextCursor
      additionalProperties: false
    NotificationPageMeta:
      type: object
      properties:
        nextCursor:
          type:
          - string
          - 'null'
          format: uuid
        unreadCount:
          type: integer
          minimum: 0
      required:
      - nextCursor
      - unreadCount
      additionalProperties: false
    AssistSearchResult:
      type: object
      properties:
        record:
          $ref: '#/components/schemas/Record'
        score:
          type: number
      required:
      - record
      - score
      additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: *id002
            message: *id002
            details: {}
            requestId: *id002
          required:
          - code
          - message
          - requestId
          additionalProperties: false
      required:
      - error
      additionalProperties: false
      example:
        error:
          code: VALIDATION_FAILED
          message: Please check your details.
          details:
          - path: /email
            message: Enter a valid email.
          requestId: req-123
    User:
      type: object
      properties:
        id: *id032
        email:
          type: string
          format: email
        displayName: *id002
        role:
          type: string
          enum:
          - user
          - admin
        mfaEnabled:
          type: boolean
          const: false
          description: False in ordinary login responses; enabled accounts must complete an MFA challenge instead.
      required:
      - id
      - email
      - displayName
      - role
      - mfaEnabled
      additionalProperties: false
    SessionUser:
      type: object
      properties:
        id: *id032
        email:
          type: string
          format: email
        displayName: *id002
        role:
          type: string
          enum:
          - user
          - admin
        mfaEnabled: *id030
      required:
      - id
      - email
      - displayName
      - role
      - mfaEnabled
      additionalProperties: false
    MfaUser:
      type: object
      properties:
        id: *id032
        email:
          type: string
          format: email
        displayName: *id002
        role:
          type: string
          enum:
          - user
          - admin
        mfaEnabled:
          type: boolean
          const: true
      required:
      - id
      - email
      - displayName
      - role
      - mfaEnabled
      additionalProperties: false
    MfaLogin:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/MfaUser'
            token: *id002
          required:
          - user
          - token
          additionalProperties: false
      required:
      - data
      additionalProperties: false
    Login:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            token: *id002
          required:
          - user
          - token
          additionalProperties: false
      required:
      - data
      additionalProperties: false
      example:
        data:
          user:
            id: c4f2b566-5b53-4ad9-b572-97e7f943ea10
            email: sana@example.com
            displayName: Sana
            role: user
            mfaEnabled: false
          token: opaque-session-token
    Record:
      type: object
      properties:
        id: *id032
        entity: *id002
        ownerId: *id032
        data:
          type: object
          additionalProperties: true
          description: Validated against the entity schema returned by GET /api/v1/entities.
        visibility:
          type: string
          enum:
          - private
          - public
        version: *id063
        createdAt: *id028
        updatedAt: *id028
      required:
      - id
      - entity
      - ownerId
      - data
      - visibility
      - version
      - createdAt
      - updatedAt
      additionalProperties: false
      example:
        id: c4f2b566-5b53-4ad9-b572-97e7f943ea10
        entity: notes
        ownerId: c4f2b566-5b53-4ad9-b572-97e7f943ea10
        data:
          title: Meeting notes
        visibility: private
        version: 1
        createdAt: '2026-11-23T12:00:00Z'
        updatedAt: '2026-11-23T12:00:00Z'
    File:
      type: object
      properties:
        id: *id032
        contentType: *id002
        sizeBytes: *id063
        width:
          type:
          - integer
          - 'null'
        height:
          type:
          - integer
          - 'null'
        originalName: *id029
        visibility: *id002
        createdAt: *id028
        url:
          type: string
          format: uri-reference
          x-widget: file
          example: /api/v1/files/c4f2b566-5b53-4ad9-b572-97e7f943ea10/content
      required:
      - id
      - contentType
      - sizeBytes
      - width
      - height
      - originalName
      - visibility
      - createdAt
      - url
      additionalProperties: false
    Entity:
      type: object
      properties:
        name: *id002
        label: *id002
        read:
          type: string
          enum:
