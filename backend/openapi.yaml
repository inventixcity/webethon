      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Must contain non-whitespace characters.
                parentId:
                  type:
                  - string
                  - 'null'
                  format: uuid
              required:
              - body
              additionalProperties: false
      responses:
        '201':
          description: Successful response.
          content:
