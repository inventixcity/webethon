  /api/v1/assist/search:
    post:
      operationId: postApiV1AssistSearch
      summary: Search owned records
      description: Uses semantic search when embeddings are configured; otherwise uses configured lexical search with
        score 1.0. Returns only viewer-owned records.
      security:
      - sessionCookie: []
      - hostSessionCookie: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entity:
                  type: string
                  maxLength: 48
                query:
                  type: string
                  minLength: 1
                  maxLength: 100
                limit:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 10
              required:
              - entity
              - query
              additionalProperties: false
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssistSearchResult'
                required:
                - data
                additionalProperties: false
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '413':
          $ref: '#/components/responses/E413'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
