openapi: 3.1.0
info:
  title: Invigil API
  version: 1.0.0
  description: HTTP API. Session tokens are opaque; use the session cookie or the same token as a Bearer credential. Cookie-authenticated
    mutations require a valid Origin or Referer. Global middleware can return shared errors before a handler; x-request-id
    is returned on responses. Signup uses the signup cookie scoped to /api/v1/auth; password reset uses the reset cookie scoped
    to /api/v1/auth/password. These are separate from the session cookie.
servers:
- url: /
  description: Current origin
paths:
  /api/v1/entities/{entity}/stats:
    get:
      operationId: getApiV1EntitiesEntityStats
      summary: Aggregate records
      description: 'Unknown or repeated parameters are rejected; query up to 8192 bytes, each value up to 2048 bytes.
        Window bounds creation time: from inclusive, to exclusive; defaults to last 30 days ending now, positive and
        at most 366 days. Percent-encode + in offsets. Buckets start midnight UTC; weeks start Monday. At most 200
        groups. Count includes null/missing values; numeric aggregates ignore them and return null when empty. Ungrouped
        results contain one null key; grouped empty results contain no rows. Missing and null group together. scope=mine
        requires a viewer, public follows record access and all requires admin.'
      security:
      - {}
      - sessionCookie: []
      - hostSessionCookie: []
      - bearerAuth: []
      parameters:
      - name: entity
        in: path
        required: true
        schema:
          type: string
      - name: metric
        in: query
        required: true
        schema:
          type: string
        description: count or sum:field, avg:field, min:field, max:field for a configured numeric field.
      - name: groupBy
        in: query
        required: false
        schema:
          type: string
        description: Filterable scalar field, or createdAt/date-time schema field followed by :day, :week or :month.
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: scope
        in: query
        required: false
        schema:
          type: string
          enum:
          - mine
          - public
          - all
          default: mine
      - name: filter[field]
        in: query
        required: false
        schema:
          type: string
        description: Replace field with a configured filterable field; use records list filter syntax.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '413':
          $ref: '#/components/responses/E413'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
  /api/v1/assist/ask:
    post:
      operationId: postApiV1AssistAsk
      summary: Ask the assistant
      description: 'SSE event payloads: delta (AssistDeltaEvent), sources (AssistSourcesEvent), pending (AssistPendingEvent),
        done (AssistDoneEvent), error (AssistErrorEvent). Up to five tool calls; only viewer-owned records are accessed.
        Writes are proposals, not mutations; proposals expire in ten minutes and are viewer-bound and single-use.'
      security:
      - sessionCookie: []
      - hostSessionCookie: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 8000
                entity:
                  type: string
                  maxLength: 48
              required:
              - question
              additionalProperties: false
      responses:
        '200':
          description: Successful response.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                conversation:
                  summary: Example events
                  value: 'event: delta
  
                    data: {"text":"Hello"}
  
  
                    event: sources
  
                    data: {"sources":[{"entity":"notes","id":"c4f2b566-5b53-4ad9-b572-97e7f943ea10","label":"notes"}]}
  
  
                    event: pending
  
                    data: {"pendingActions":[]}
  
  
                    event: done
  
                    data: {"usage":{"input":10,"output":4}}
  
  
                    '
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '413':
          $ref: '#/components/responses/E413'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          $ref: '#/components/responses/E503'
  /api/v1/assist/confirm:
    post:
      operationId: postApiV1AssistConfirm
      summary: Confirm a proposed action
      description: Claim and record mutation commit atomically.
      security:
      - sessionCookie: []
      - hostSessionCookie: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actionId:
                  type: string
                  format: uuid
              required:
              - actionId
              additionalProperties: false
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      record:
                        $ref: '#/components/schemas/Record'
                    required:
                    - record
                    additionalProperties: false
                required:
                - data
                additionalProperties: false
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '413':
          $ref: '#/components/responses/E413'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
