name: docker

# Builds the API image, scans it, and on main and tags pushes it to GHCR with an SBOM and provenance.
# Pull requests build and scan only, and never push. The same job also validates the Kubernetes manifests.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "backend/**"
      - "deploy/**"
      - "scripts/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build, scan, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GHCR image names must be lowercase, but the GitHub owner name may not be.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/invigil-api" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Scan before anything is pushed. The image is built locally (load: true), scanned, and only
      # then pushed. The second build reuses the same cache, so it costs little.
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile
          load: true
          push: false
          tags: invigil-api:scan
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Trivy in a pinned SHA (v0.36.0). Tags 0.0.1-0.34.2 were force-pushed to malicious code in March 2026.
      - name: Scan image (fail on CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: invigil-api:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance and sbom attach SLSA provenance and an SPDX SBOM as attestations to the image.
      - name: Build, push, attest
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Image published"
            echo ""
            echo "- Repository: \`${IMAGE}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo ""
            echo "Pin this digest in deploy/k8s/overlays/prod/kustomization.yaml."
          } >> "$GITHUB_STEP_SUMMARY"

  manifests:
    name: validate manifests and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tgz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      # The real secret files are gitignored, so CI renders from the placeholder examples.
      - name: Render both overlays
        run: |
          set -euo pipefail
          cp deploy/k8s/overlays/local/secrets.env.example deploy/k8s/overlays/local/secrets.env
          cp deploy/k8s/overlays/local/postgres.env.example deploy/k8s/overlays/local/postgres.env
          cp deploy/k8s/overlays/prod/secrets.env.example deploy/k8s/overlays/prod/secrets.env
          kubectl kustomize deploy/k8s/overlays/local > "$RUNNER_TEMP/local.yaml"
          kubectl kustomize deploy/k8s/overlays/prod > "$RUNNER_TEMP/prod.yaml"

      - name: kubeconform (strict schema check)
        run: |
          set -euo pipefail
          kubeconform -strict -summary -kubernetes-version 1.34.0 \
            "$RUNNER_TEMP/local.yaml" "$RUNNER_TEMP/prod.yaml"

      # shellcheck is preinstalled on GitHub's Ubuntu images.
      - name: shellcheck
        run: shellcheck --severity=warning scripts/*.sh backend/scripts/*.sh
