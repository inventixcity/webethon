name: api-image

# Builds the API container (backend/Dockerfile) and pushes it to GHCR. Render runs this image, so
# no Rust is ever compiled on Render. Optionally triggers a Render deploy of the exact new tag.
#
# Repository settings:
#   secret   RENDER_DEPLOY_HOOK_URL   optional; Render > invigil-api > Settings > Deploy Hook
# The package ghcr.io/inventixcity/invigil-api can be made public (Package settings > Visibility),
# so Render pulls it without registry credentials.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/api-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/inventixcity/invigil-api

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.sha }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=invigil-api
          cache-to: type=gha,mode=max,scope=invigil-api

      - name: Deploy on Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          TAG: ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; skipping the Render deploy."
            exit 0
          fi
          image="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$TAG")"
          curl -fsS -X POST "${HOOK}&imgURL=${image}" -o /dev/null
          echo "Render deploy triggered for $TAG"
