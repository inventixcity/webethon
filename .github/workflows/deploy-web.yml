name: deploy-web

# Deploys the Next.js app to Vercel with a prebuilt bundle: preview on pull requests, production on main.
on:
  pull_request:
    paths:
      - "ui components/**"
      - ".github/workflows/deploy-web.yml"
  push:
    branches: [main]
    paths:
      - "ui components/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: vercel ${{ github.event_name == 'push' && 'production' || 'preview' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Forked pull requests get no secrets, so they can't deploy. Skip them instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # The Vercel CLI reads this variable directly, so the token never appears on a command line.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: "ui components"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: "ui components/package.json"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: "ui components/pnpm-lock.yaml"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Vercel CLI pinned to an exact version. Bump it on purpose.
      - name: Deploy (prebuilt)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then
            target="production"; prod_flag="--prod"
          else
            target="preview"; prod_flag=""
          fi
          vercel="npx --yes vercel@66.6.0"
          $vercel pull --yes --environment="$target"
          $vercel build $prod_flag
          url="$($vercel deploy --prebuilt $prod_flag | tail -n 1)"
          {
            echo "### Deployed to Vercel ($target)"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
