name: keepalive

# Render free web services sleep after 15 minutes without traffic; a cold start takes ~30-60 s.
# Pings the API every 10 minutes so a candidate never waits on a sleeping server.
#
# Repository variable (Settings > Secrets and variables > Actions > Variables):
#   API_HEALTH_URL   e.g. https://invigil-api.onrender.com/healthz

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ping the API
        env:
          URL: ${{ vars.API_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "API_HEALTH_URL is not set; nothing to ping."
            exit 0
          fi
          # A sleeping instance can take up to a minute to wake; retry instead of failing at once.
          curl -fsS --retry 4 --retry-delay 15 --retry-all-errors --max-time 90 "$URL"
          echo
