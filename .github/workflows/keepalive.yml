name: keepalive

# Render's free tier sleeps after 15 idle minutes; a light health ping keeps the API warm for demos.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        env:
          URL: ${{ vars.API_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then echo "API_HEALTH_URL is not set"; exit 0; fi
          curl -fsS --max-time 60 "$URL" || true
